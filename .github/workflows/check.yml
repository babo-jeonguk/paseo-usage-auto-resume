name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        paseo: [0.16.2, 0.17.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: matrix.paseo != '0.17.1'
        run: npm install --no-save --package-lock=false @getpaseo/client@${{ matrix.paseo }} @getpaseo/plugin@${{ matrix.paseo }} @getpaseo/protocol@${{ matrix.paseo }}
      - run: npm run check

  simulation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        paseo: [0.16.2, 0.17.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare simulation tools
        shell: bash
        run: |
          mkdir -p test-results/simulation
          npm install --prefix "$RUNNER_TEMP/uar-tools" --no-audit --no-fund \
            @getpaseo/cli@${{ matrix.paseo }} @anthropic-ai/claude-code@2.1.306 \
            @openai/codex@0.152.1 playwright@1.65.0 \
            2>&1 | tee test-results/simulation/setup.log
      - name: Install Chromium
        if: runner.os == 'Linux'
        shell: bash
        run: npx --prefix "$RUNNER_TEMP/uar-tools" playwright install --with-deps chromium 2>&1 | tee test-results/simulation/browser.log
      - name: Run CLI and web simulation
        shell: bash
        run: |
          tools="$RUNNER_TEMP/uar-tools"
          tool_path="$tools/node_modules/.bin"
          if [[ "$RUNNER_OS" == Windows ]]; then
            git_dir=$(cygpath -am "$(dirname "$(command -v git)")")
            tool_path="$tool_path;$git_dir"
          fi
          export PW_ROOT="$tools/node_modules"
          source_url=$(node -p 'require("node:url").pathToFileURL(process.cwd()).href')
          node --no-maglev e2e/e2e.mjs --cli "$tools/node_modules/@getpaseo/cli" \
            --path "$tool_path" --root "$RUNNER_TEMP/uar-simulation" \
            --from v1.4.1 --to "$GITHUB_SHA" --source "$source_url" \
            --suites claude,codex --ui 1 --out test-results/simulation \
            2>&1 | tee test-results/simulation/run.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulation-${{ matrix.os }}-paseo-${{ matrix.paseo }}
          path: test-results/simulation/
          if-no-files-found: warn
